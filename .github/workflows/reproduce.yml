name: reproduce

# Once a week your runner recomputes HORIZON SHIELD's published NENRIN evidence with the published verifiers
# (PyPI nenrin-verify, npm's nenrin_verify.mjs), writes receipt.json, and GitHub signs an attestation of that file
# under your repository's identity (Sigstore, no key of yours involved). Anyone can check it:
#   gh attestation verify receipt.json -R <you>/<this repository>
# A receipt from the operator's own machine would not count; one from yours does.
on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays; change it
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ogasurfproject-jpg/horizon-shield
          ref: d9b3075928ab0ef41f1a9b6b6970887c18b4fb44
          path: upstream
          sparse-checkout: |
            workers/hs-ledger/nenrin/a2a-python-e2e-v0
            workers/hs-ledger/nenrin/sdk
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: install the published verifiers
        run: python -m pip install --disable-pip-version-check "nenrin-verify==0.3.0" "a2a-sdk[http-server]==1.2.1" uvicorn
      - name: recompute
        run: UPSTREAM=upstream OUT=receipt.json bash reproduce.sh
      - name: attest the receipt (GitHub signs it under this repository's identity)
        if: always() && hashFiles('receipt.json') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && hashFiles('receipt.json') != ''
        with:
          name: nenrin-reproduction-receipt
          path: receipt.json
          retention-days: 90
